# Builds a bootable KICK firmware image for KickEmu from the repository's Buildroot tree
# (KTKick_defconfig plus Emulator/firmware/buildroot/emulator.fragment) and KT_Kick
# cross-built against it. See Emulator/firmware/README.md.
#
# Three jobs, each cached on its inputs so that a change to a later stage does not repeat the
# multi-hour Buildroot build:
#   buildroot  Buildroot in a debian:bullseye container -> rootfs, kernel, DTB, SDK
#   app        KT_Kick with the SDK's toolchain and sysroot
#   image      KT_Kick into the rootfs, eMMC image with the KICK layout -> artifact
name: firmware-image

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/firmware-image.yml
      - Emulator/firmware/**
      - Linux/buildroot/**
      - Kick/**

concurrency:
  group: firmware-image-${{ github.ref }}
  # A newer push waits instead of cancelling a build that may be hours in.
  cancel-in-progress: false

permissions:
  contents: read

env:
  # KT_Kick sources. The repository's own Kick/ tree does not configure: the public release
  # lacks the AudIO_juce/AudIO_constants modules and AudIO/juce_modules.cmake that Kick
  # includes. The fork restores them; pinned to a commit so the image is reproducible.
  KTKICK_REPO: KickEm-Tools/0700-AAM
  KTKICK_REF: 6dd85eaedc1d2f859b5f749937ac91412932a94f

jobs:
  buildroot:
    name: Buildroot
    # x86_64: the external Arm toolchain of KTKick_defconfig is an x86_64 host binary.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Cache keys
        id: keys
        run: |
          echo "out=br-out-v1-${{ hashFiles('Linux/buildroot/**', 'Emulator/firmware/buildroot/**', 'Emulator/firmware/overlay/**', 'Emulator/firmware/scripts/br-build.sh') }}" >> "$GITHUB_OUTPUT"
          echo "dl=br-dl-v1-${{ hashFiles('Linux/buildroot/configs/KTKick_defconfig', 'Emulator/firmware/buildroot/emulator.fragment') }}" >> "$GITHUB_OUTPUT"

      # The whole result of this job, keyed on everything that goes into it.
      - name: Restore Buildroot output
        id: out
        uses: actions/cache/restore@v4
        with:
          path: br-export
          key: ${{ steps.keys.outputs.out }}

      - name: Restore downloads
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: br-dl
          key: ${{ steps.keys.outputs.dl }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.keys.outputs.dl }}-
            br-dl-v1-

      # Buildroot 2021.02.3's host packages do not build with Ubuntu 24.04's GCC 13. The
      # build directory is on /mnt, the runner's larger disk.
      - name: Build
        if: steps.out.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /mnt/br
          sudo chown "$(id -u):$(id -g)" /mnt/br
          mkdir -p br-dl
          docker run --rm \
            -v "$PWD:/src:ro" -v /mnt/br:/work -v "$PWD/br-dl:/dl" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            debian:bullseye bash /src/Emulator/firmware/scripts/br-build.sh
          mkdir -p br-export
          cp /mnt/br/export/* br-export/
          df -h / /mnt

      - name: Save downloads
        if: always() && steps.out.outputs.cache-hit != 'true' && hashFiles('br-dl/**') != ''
        uses: actions/cache/save@v4
        with:
          # Buildroot's git clones are only needed to make the tarballs next to them.
          path: |
            br-dl
            !br-dl/*/git
          key: ${{ steps.keys.outputs.dl }}-${{ github.run_id }}

      - name: Save Buildroot output
        if: steps.out.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: br-export
          key: ${{ steps.keys.outputs.out }}

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-logs
          path: |
            /mnt/br/export/*.log
            /mnt/br/export/buildroot.config
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Buildroot output
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-export
          path: br-export
          retention-days: 2
          if-no-files-found: error

  app:
    name: KT_Kick
    needs: buildroot
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: buildroot-export
          path: br-export

      - name: Cache key
        id: keys
        run: |
          sdk=$(sha256sum br-export/sdk.tar.gz | cut -c1-16)
          echo "app=ktkick-v1-${KTKICK_REF}-${sdk}-${{ hashFiles('Emulator/firmware/app/**', 'Emulator/firmware/scripts/build-ktkick.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore KT_Kick
        id: app
        uses: actions/cache/restore@v4
        with:
          path: ktkick-out
          key: ${{ steps.keys.outputs.app }}

      # As the fork's CI: the native compiler and headers are for juceaide, the JUCE helper
      # tool that is built for the build host during configuration.
      - name: Install packages
        if: steps.app.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config file g++ \
            libfreetype-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxi-dev libxrandr-dev libxrender-dev \
            libasound2-dev libcurl4-openssl-dev

      # JUCE (7.0.12, cloned and patched by CPM at configure time).
      - name: CPM cache
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ktkick-work/cpm
          key: cpm-ktkick-${{ env.KTKICK_REF }}

      - name: Build
        if: steps.app.outputs.cache-hit != 'true'
        run: Emulator/firmware/scripts/build-ktkick.sh br-export/sdk.tar.gz ktkick-work ktkick-out

      - name: Save KT_Kick
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ktkick-out
          key: ${{ steps.keys.outputs.app }}

      - uses: actions/upload-artifact@v4
        with:
          name: ktkick
          path: ktkick-out/KT_Kick.tar.gz
          retention-days: 2
          if-no-files-found: error

  image:
    name: eMMC image
    needs: [buildroot, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: buildroot-export
          path: br-export

      - uses: actions/download-artifact@v4
        with:
          name: ktkick
          path: ktkick

      - name: Install packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gdisk zstd

      - name: Assemble
        run: Emulator/firmware/scripts/assemble-image.sh br-export ktkick/KT_Kick.tar.gz firmware

      # A workflow artifact only, never a release: see Emulator/firmware/README.md.
      - uses: actions/upload-artifact@v4
        with:
          name: kick-firmware
          path: firmware
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
