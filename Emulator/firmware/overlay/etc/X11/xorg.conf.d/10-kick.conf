# X on the KICK framebuffer (LCDIF -> DSIM -> SN65DSI84, 1024x600) for KT_Kick.
# Input devices (GT911 touch, gpio-keys) come from udev through xf86-input-libinput.

Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection

Section "Device"
    Identifier "kick-fb"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "kick-screen"
    Device     "kick-fb"
EndSection
