# Expected KICK board configuration for kick-selftest. Sourced by /bin/sh.
# Devices are identified by their controller base address (from the i.MX8MM memory map
# and the board DT), so a wrong bus or alias numbering in the emulator shows up as FAIL.

# SoC identification (/sys/devices/soc0)
SOC_ID="i.MX8MM"

# "<tty>:<controller base>" for every UART, in alias order (serial0..serial3)
UARTS="ttymxc0:30860000 ttymxc1:30890000 ttymxc2:30880000 ttymxc3:30a60000"

# "<bus number>:<controller base>" for the I2C buses (the application opens /dev/i2c-3)
I2C_BUSES="0:30a20000 1:30a30000 2:30a40000 3:30a50000"

# "<bus>:<address>:<label>:<driver or ->" for the devices; "-" means no kernel driver,
# the device is checked with a bus transaction from user space instead.
I2C_DEVICES="0:4b:BD71847-PMIC:rohm-bd718x7 2:14:GT911-touch:Goodix-TS 2:68:RTC:rtc-ds1307 3:0c:CV-converter:-"

# CV/gate converter: channel register used for the DAC write / ADC read test.
# 0x30|ch writes a 12-bit DAC value (0 V here), 0x90|ch selects a channel for reading.
CV_BUS=3
CV_ADDR=0x0c
CV_TEST_CHANNEL=0

# "<block device>:<controller base>:<MMC|SD>:<required 0|1>"
MMC_DEVICES="mmcblk2:30b60000:MMC:1 mmcblk1:30b50000:SD:1"

# Network
ETH_IF=eth0
ETH_LINK_TIMEOUT=10
DHCP_TIMEOUT=15

# Audio: card 0, PCM device 0, S32_LE at 48 kHz
AUDIO_CARD=0
AUDIO_FORMAT=S32_LE
AUDIO_RATE=48000
AUDIO_CHANNELS=2
AUDIO_SECONDS=1

# Touch: input device name and how long to wait for events (0 = presence only)
TOUCH_NAME="Goodix Capacitive TouchScreen"
TOUCH_EVENT_TIMEOUT=10

# Power key input device name (snvs_pwrkey driver names it after the platform device)
PWRKEY_NAME="30370000.snvs:snvs-powerkey"

# Display: DRM card and the expected mode. The board DT drives LCDIF -> MIPI DSIM ->
# SN65DSI84 (I2C1 0x2c) with the bridge's display-timings of 1024x600, so that is the
# mode the KICK kernel sets up, although the touch controller is configured for 800x480.
DRM_CARD=/dev/dri/card0
FB_DEV=/dev/fb0
PANEL_MODE="1024x600"

# GPU kernel module and its device node
GPU_MODULE=galcore
GPU_DEV=/dev/galcore

# Memory test size (memtester syntax), one loop
MEMTEST_SIZE=16M
